<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CKA Handbook by Puru Tuladhar</title>
  <meta name="description" content="Prepare for the Kubernetes Certified Kubernetes Administrator (CKA) exam with the CKA Handbook by Puru Tuladhar. Written by a Kubestronaut who's been there, done that. Practical hands-on, real exam focus - no fluff.">
  <meta name="keywords" content="Kubernetes, CKA Handbook, Certified Kubernetes Administrator, CNCF Certification, Kubernetes Exam Guide, Puru Tuladhar">
  <meta name="author" content="Puru Tuladhar">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- For older browsers -->
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Open Graph for social media -->
  <meta property="og:title" content="CKA Handbook by Puru Tuladhar">
  <meta property="og:description" content="Written by a Kubestronaut who's been there, done that. Practical hands-on, real exam focus - no fluff.">
  <meta property="og:image" content="cover.png">
  <meta property="og:url" content="https://cka.purutuladhar.com">
  <meta property="og:type" content="website">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    let countdown = 30;
    function startRedirect() {
      const counter = document.getElementById("counter");
      const interval = setInterval(() => {
        countdown--;
        counter.textContent = countdown;
        if (countdown === 0) {
          clearInterval(interval);
          window.location.href = "https://ptuladhar.gumroad.com/l/cka-handbook";
        }
      }, 1000);
    }
    window.onload = startRedirect;
  </script>
</head>
<body class="flex items-center justify-center min-h-screen" style="background-color: #f8f8f8;">
  <div class="text-center">
    <!-- Main CKA Book -->    
    <img src="cover.png" width=600 style="rotate: -2deg;"/>
    <h1 class="text-3xl font-bold text-gray-800 mb-4">CKA Handbook - Preview Edition</h1>
    <p class="text-lg text-gray-600">Redirecting you to Gumroad in 
      <span id="counter" class="font-bold text-blue-600">30</span> seconds...
    </p>
    <p class="mt-4 text-sm text-gray-500">If not redirected, <a href="https://ptuladhar.gumroad.com/l/cka-handbook" class="text-blue-500 underline">click here</a>.</p>
    
    <!-- Divider -->
    <hr class="my-8 border-gray-300">

    <!-- Cross-Promotion: CKS -->
    <div class="mt-6">
      <h2 class="text-2xl font-semibold text-gray-800 mb-4">Also Available</h2>
      <a href="https://cks.purutuladhar.com" class="block max-w-sm mx-auto transition">
        <center><img src="cks-cover.png" width=300 alt="CKS Handbook cover by Puru Tuladhar" style="rotate: 2deg;" class="rounded-lg"></center>
        <div class="p-4">
          <h3 class="text-lg font-bold text-gray-800">CKS Handbook - 2nd Edition</h3>
          <p class="text-sm text-gray-600">The essential guide for mastering Kubernetes security and passing the CKS exam with confidence.</p>
          <span class="inline-block mt-3 text-blue-600 font-semibold">Get the book →</span>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
