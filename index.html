<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CKA Handbook Redirect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    let countdown = 5;
    function startRedirect() {
      const counter = document.getElementById("counter");
      const interval = setInterval(() => {
        countdown--;
        counter.textContent = countdown;
        if (countdown === 0) {
          clearInterval(interval);
          window.location.href = "https://gumroad.com/your-cka-handbook-link";
        }
      }, 1000);
    }
    window.onload = startRedirect;
  </script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  <div class="text-center">
    <img src="cover.png" width=600 />
    <h1 class="text-3xl font-bold text-gray-800 mb-4">CKA Handbook</h1>
    <p class="text-lg text-gray-600">Redirecting you to Gumroad in 
      <span id="counter" class="font-bold text-blue-600">3</span> seconds...
    </p>
    <p class="mt-4 text-sm text-gray-500">If not redirected, <a href="https://ptuladhar.gumroad.com/l/cka-handbook" class="text-blue-500 underline">click here</a>.</p>
  </div>
</body>
</html>
